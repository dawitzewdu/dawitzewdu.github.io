<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#121d33" />
      <stop offset="60%" stop-color="#080c17" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0051ff" />
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Metallic Platinum Gradient -->
    <linearGradient id="metalGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)" />

  <!-- Outer Cybernetic Tech Ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="512" cy="512" r="400" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.3" />
  <circle cx="512" cy="512" r="370" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 24" opacity="0.4" />

  <!-- Compass / Radar Crosshair Ticks -->
  <line x1="512" y1="80" x2="512" y2="130" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="512" y1="894" x2="512" y2="944" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="80" y1="512" x2="130" y2="512" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="894" y1="512" x2="944" y2="512" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Orbital Sensor Nodes -->
  <circle cx="796" cy="228" r="7" fill="#00f5ff" filter="url(#softGlow)" />
  <circle cx="228" cy="796" r="7" fill="#10b981" filter="url(#softGlow)" />
  <circle cx="228" cy="228" r="5" fill="#94a3b8" opacity="0.6" />
  <circle cx="796" cy="796" r="5" fill="#94a3b8" opacity="0.6" />

  <!-- Hexagonal Tech Shield Outer Boundary -->
  <polygon points="512,180 790,340 790,684 512,844 234,684 234,340" 
           fill="#0c1424" fill-opacity="0.75" 
           stroke="url(#cyanGrad)" stroke-width="6" 
           stroke-linejoin="round" filter="url(#softGlow)" />

  <polygon points="512,204 768,352 768,672 512,820 256,672 256,352" 
           fill="none" 
           stroke="#1e293b" stroke-width="2" 
           stroke-linejoin="round" opacity="0.8" />

  <!-- Inner Ambient Core Glow Behind Crest -->
  <circle cx="512" cy="512" r="180" fill="#00f5ff" opacity="0.12" filter="url(#coreGlow)" />

  <!-- Central Crest: Stylized Geometric "D" + Ascending Chevron Wings -->
  <!-- Left Pillar of "D" / Forward Propulsion Bar -->
  <path d="M 360,290 
           L 420,290 
           L 420,734 
           L 360,734 
           Z" 
        fill="url(#metalGrad)" />
  
  <path d="M 375,310 
           L 405,310 
           L 405,714 
           L 375,714 
           Z" 
        fill="#0f172a" opacity="0.4" />

  <!-- Precision Delta Ascent Wing (The Upward Career Launch) -->
  <path d="M 512,270 
           L 690,470 
           L 620,490 
           L 512,370 
           L 440,450 
           L 440,350 
           Z" 
        fill="url(#cyanGrad)" filter="url(#softGlow)" />

  <!-- Dynamic Curved Arc of the "D" (Looping Network) -->
  <path d="M 420,290 
           C 580,290 690,380 690,512 
           C 690,644 580,734 420,734 
           L 420,660 
           C 530,660 616,590 616,512 
           C 616,434 530,364 420,364 
           Z" 
        fill="url(#cyanGrad)" />

  <!-- Futuristic Inner Secondary Wing & Flight Path -->
  <path d="M 512,410 
           L 630,530 
           L 590,550 
           L 512,470 
           L 450,530 
           L 450,470 
           Z" 
        fill="url(#emeraldGrad)" filter="url(#softGlow)" />

  <!-- Central Intelligence Core Spark (Target / Star Node) -->
  <polygon points="512,480 524,506 550,512 524,518 512,544 500,518 474,512 500,506" 
           fill="#ffffff" filter="url(#coreGlow)" />

  <!-- Floating Data Beacons on Crest -->
  <circle cx="512" cy="270" r="9" fill="#00f5ff" filter="url(#softGlow)" />
  <circle cx="690" cy="470" r="7" fill="#38bdf8" />
  <circle cx="690" cy="512" r="7" fill="#00f5ff" filter="url(#softGlow)" />
  <circle cx="420" cy="290" r="8" fill="#ffffff" />
  <circle cx="420" cy="734" r="8" fill="#00a8ff" />

  <!-- Bottom Tech Sub-Label: "CAREER OPS" -->
  <text x="512" y="795" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="14" 
        fill="#94a3b8" 
        opacity="0.85">CAREER OPS</text>
  
  <text x="512" y="828" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#00f5ff" 
        opacity="0.9">24/7 AUTONOMOUS</text>

  <!-- Precision Corner Markers -->
  <path d="M 60,100 L 60,60 L 100,60" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M 964,100 L 964,60 L 924,60" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M 60,924 L 60,964 L 100,964" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M 964,924 L 964,964 L 924,964" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
</svg>
